apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-app
  namespace: notes-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: notes-app
  template:
    metadata:
      labels:
        app: notes-app
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do echo waiting for db; sleep 2; done"]
      containers:
        - name: notes-app
          image: notes-app:local
          imagePullPolicy: IfNotPresent   # image is loaded into kind, not pulled
          ports:
            - containerPort: 5000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: password
            # $(POSTGRES_PASSWORD) is expanded by Kubernetes; must come after the var above
            - name: DATABASE_URL
              value: postgresql+psycopg2://notes:$(POSTGRES_PASSWORD)@postgres:5432/notes
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: notes-app
  namespace: notes-dev
spec:
  selector:
    app: notes-app
  ports:
    - port: 80
      targetPort: 5000
